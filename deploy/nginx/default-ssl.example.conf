# Продакшен Nginx для API на api.georunapp.ru (TLS + редирект HTTP→HTTPS).
# На сервере: cp deploy/nginx/default-ssl.example.conf deploy/nginx/default.conf
# Перед включением: certbot для api.georunapp.ru и в compose у nginx том /etc/letsencrypt с хоста
# (см. deploy/HTTPS_LETSENCRYPT.md).

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.georunapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.georunapp.ru;

    ssl_certificate     /etc/letsencrypt/live/api.georunapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.georunapp.ru/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_upstream;
    }
}
