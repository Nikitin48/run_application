name: Backend Docker

on:
  push:
    branches: [main]
    paths:
      - "python_backend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend-docker.yml"
  pull_request:
    paths:
      - "python_backend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend-docker.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR must be lowercase)
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./python_backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
